<style>
:root{--bg:#f6efe5;--card:#fffdf9;--ink:#2b1a20;--mut:#85767b;--y:#7b2c43;--y2:#f0e4da;--beige:#f6efe5;--line:#e8dccb;--ok:#2f7d57;--bad:#c8493a;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.ic{vertical-align:-.2em;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:14px}
header{background:#fbf6ee;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
header .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{color:var(--y);display:flex;align-items:center;justify-content:center}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
h2{font-size:12px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.month{display:flex;align-items:center;gap:2px;font-weight:600;font-size:12.5px;white-space:nowrap}
.month button{border:1px solid var(--line);background:#fff;border-radius:50%;width:28px;height:28px;font-size:16px;color:var(--ink);font-family:inherit;padding:0;line-height:1}
.month span{padding:0 6px;display:inline-block}.month span::first-letter{text-transform:uppercase}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat small{color:var(--mut);display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:2px}
.stat b{font-size:18px;font-weight:700}
.stat.hl{border-color:var(--y)}
.bar{height:8px;background:#eadfce;border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:9px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row>b{display:flex;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}
.tag{font-size:11px;border-radius:999px;padding:3px 9px;background:#efe4d8;font-weight:600;display:inline-flex;align-items:center;gap:4px;color:#6d5a60}
.tag.ok{background:#dcf1e4;color:#1f6a40}.tag.sp{background:#fbe6c4;color:#8a5a0c}
button.b,.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;background:var(--y);color:#fff;font-size:13.5px;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
button.g{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px #d9cbb8}button.d{background:transparent;color:#b03a2c;box-shadow:inset 0 0 0 1px #ecc4be}
button.sm{padding:7px 11px;font-size:12px;border-radius:9px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fbf6ee;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:10px;color:var(--mut);font-weight:700;font-family:inherit;position:relative}
nav button span{display:flex;justify-content:center;margin-bottom:3px;position:relative}
nav button.on{color:var(--ink)}
nav button.on::before{content:'';position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:var(--y)}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--y);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(75,25,45,.25);z-index:6}
.alloc{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.alloc input[type=checkbox]{width:22px;height:22px;padding:0;accent-color:var(--ok)}
.alloc .n{flex:1;display:flex;align-items:center;gap:8px}.alloc.paid .n,.alloc.paid .v{text-decoration:line-through;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(20,25,40,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
label{display:block;font-size:11px;color:var(--mut);margin:12px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
input,select{width:100%;padding:11px 12px;border:1px solid #dccfbc;border-radius:10px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,select:focus{outline:2px solid var(--y);border-color:var(--y)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.arow{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin:5px 0}
.arow>span{display:flex;align-items:center;gap:8px}
.warn{color:var(--bad)}.good{color:var(--ok)}
.donutwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.legend div{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cols{display:flex;align-items:flex-end;gap:10px;height:150px;padding:6px 0;justify-content:space-around}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.col .pair{display:flex;gap:3px;align-items:flex-end;height:120px}
.col .pair i{width:16px;border-radius:5px 5px 0 0;display:block;min-height:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 8px;vertical-align:-1px}
.empty{text-align:center;color:var(--mut);padding:24px 10px}
.lizzie{background:linear-gradient(135deg,#f1eafb,#f8f1fa)}
body.liz{--bg:#fdf4fb;--y:#b58be0;--y2:#f3e8fc;--beige:#fdf4fb;--line:#f0d9ef;font-family:'Fredoka','Nunito',-apple-system,BlinkMacSystemFont,sans-serif;background-image:radial-gradient(#f6d8f0 1.6px,transparent 1.8px);background-size:24px 24px}
body.liz header{background:#fff0fa;border-bottom:2px dashed #f0c6e6}
body.liz .logo{background:#fff;border-radius:50%;width:38px;height:38px;font-size:22px}
body.liz h1{font-weight:600;color:#6a3fa8}
body.liz .card{border-radius:24px;border:2px solid #f3d6ee}
body.liz button.b{background:#9b6fd6;color:#fff;border-radius:999px;box-shadow:none}
body.liz button.g{background:#f3e8fc;color:#6a3fa8;box-shadow:none}
body.liz button.d{background:#ffe3ec;color:#c2406a;box-shadow:none}
body.liz input,body.liz select{border:2px solid #f0d9ef;border-radius:16px}
body.liz label{color:#a07bc8}
body.liz nav button.on{color:#6a3fa8}
.lizhero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px;margin:10px 0;background:linear-gradient(135deg,#e6d4fb,#fcd5ea);color:#4a2f7a}
.lizhero .big{font-size:42px;font-weight:600;line-height:1.1;margin:6px 0 10px}
.lizhero .deco{position:absolute;font-size:26px}
.lizchip{display:inline-flex;gap:6px;align-items:center;background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;margin:4px 6px 0 0}
.lizchip.low{background:#fff1d6;color:#8a5a0c}
.lizbar{height:18px;border-radius:99px;background:#fff;overflow:hidden;margin:12px 0 6px}
.lizbar i{display:block;height:100%;border-radius:99px;background:repeating-linear-gradient(45deg,#ff9ccc 0 10px,#ffb8dc 10px 20px)}
.lizmove{display:flex;align-items:center;gap:12px}
.lizmove .em{font-size:24px;width:44px;height:44px;border-radius:50%;background:#f3e8fc;display:flex;align-items:center;justify-content:center;flex:none}
.alert{background:#fdeceb;border:1.5px solid var(--bad);color:#7a1f14;border-radius:var(--r);padding:14px;margin:10px 0;cursor:pointer;animation:pl 1.8s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px #c8493a33}}
.soon{background:#fff6e0;border:1.5px solid #e0a43a;color:#6b4a0c;border-radius:var(--r);padding:14px;margin:10px 0;cursor:pointer}
.alert>b:first-child,.soon>b:first-child{display:flex;align-items:center;gap:6px}
.okc{background:#eaf6ee;border-color:#c5e4d0;color:#1f6a40;cursor:pointer;font-size:14px}
.bdg{position:absolute;top:-4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-style:normal;font-size:10px;border-radius:10px;padding:1px 5px}
.inst{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;margin:0;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:500}
.inst.paid span:first-of-type{text-decoration:line-through;color:var(--mut)}
.inst input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--ok)}
details summary{padding:6px 0}
input.pin{text-align:center!important;font-size:26px;letter-spacing:.5em;padding:12px}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lbox{width:100%;max-width:380px;text-align:center}
.lbox label,.lbox input{text-align:left}
.lgo{width:60px;height:60px;border-radius:18px;background:var(--y);color:#f0e2d0;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.lh{font-size:24px;margin:0}
body.locked header,body.locked .wrap,body.locked nav{display:none}
body.locked .fab{display:none!important}
.syncdot{width:8px;height:8px;border-radius:50%;background:#c9bfae;display:inline-block}
.syncdot.ok{background:var(--ok)}.syncdot.saving{background:#e0a43a}.syncdot.offline,.syncdot.error{background:var(--bad)}
</style>

<body class="locked">
<header><div class="in"><div class="brand"><span class="logo" id="logo"></span><h1 id="ttl">Nosso Dinheiro</h1><span class="syncdot" id="sync"></span></div><div class="month" id="mon"></div></div></header>

<script>
const $=s=>document.querySelector(s);
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}).replace('-','\u2212');
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS={
home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5.5h4V20"/>',

card:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/><path d="M7 15h3.5"/>',

sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/><path d="M3 4h2.2l2.3 11h10.2l2-8H6.3"/>',
trend:'<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',

wallet:'<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="3" y="8" width="18" height="12" rx="2.5"/><path d="M16 14h2"/>'
};
const ICON_KEYS=['home','drop','cross','fuel','cart','heart','shield','card','smile','trend','tag','car','building','bag','bolt'];
const ic=(n,z=18)=>`<svg class="ic" width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||ICONS.tag}</svg>`;
const BUILD='2026-10-08T13:32:27Z';
async function checkUpdate(manual){
  try{const r=await fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/const BUILD='([^']+)'/);
    if(m&&m[1]!==BUILD){
      if(!manual){let g=0;try{g=sessionStorage.getItem('nd_upd')===m[1]}catch(e){}if(g||draft||ddraft)return 'new';try{sessionStorage.setItem('nd_upd',m[1])}catch(e){}}
      location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));return 'new'}return 'same'}
  catch(e){return 'err'}
}
const KEY='nosso_dinheiro_v1';
const AUTO=[
 ['delivery','Delivery','bag',/pizza|lanche|hamb|ifood|i-food|delivery|a[cç]a[ií]|sushi|restaurante|marmita|sorvete|pastel|churras|padaria|doces?|bolo|cafe|caf[eé]/i],
 ['transporte','Transporte','car',/uber|99|[oô]nibus|metr[oô]|passagem|estaciona|ped[aá]gio|mec[aâ]nic|oficina|pneu|ipva|seguro|lavagem|revis[aã]o/i],
 ['saude','Saúde','cross',/m[eé]dic|consulta|exame|dentista|psic|plano de sa|vacina|pediatra|hospital|terapia|fisio/i],
 ['casa','Casa','home',/internet|wifi|g[aá]s|condom[ií]nio|iptu|reforma|m[oó]vel|moveis|limpeza|faxina|diarista|conserto|el[eé]trico|encanador/i],
 ['assinaturas','Assinaturas','card',/netflix|spotify|prime|disney|youtube|icloud|assinatura|mensalidade|canva|chatgpt|claude|plano de celular|celular|tim|vivo|claro/i],
 ['educacao','Educação','trend',/curso|escola|faculdade|livro|aula|material escolar|creche/i],
 ['bebe','Bebê','heart',/fralda|len[cç]o umedecido|leite|f[oó]rmula|papinha|roupinha|beb[eê]|chupeta|mamadeira|pomada/i],
 ['lazer','Lazer','smile',/cinema|passeio|viagem|festa|presente|bar|show|parque|jogo|churrasco|sa[ií]da/i],
 ['beleza','Beleza','star',/cabelo|unha|sal[aã]o|maquiagem|perfume|cosm[eé]tic|barbearia|corte/i],
 ['pets','Pets','heart',/ra[cç][aã]o|veterin|pet|cachorro|gato|banho e tosa/i],
 ['impostos','Impostos e taxas','building',/imposto|taxa|das\b|mei|multa|darf|contador|cart[oó]rio/i]
];
const detectCat=n=>{const t=(n||'').trim();if(!t)return 'outros';const m=AUTO.find(a=>a[3].test(t));return m?m[0]:'outros'};
function ensureCat(id){if(S.cats.some(c=>c.id===id))return;const a=AUTO.find(x=>x[0]===id);if(a)S.cats.push({id:a[0],name:a[1],icon:a[2],pct:0})}

const COLORS=['#7b2c43','#d0b497','#b4637a','#8b6f5c','#4f2233','#e0c9b4','#a8706f','#6f8f7e','#c27a5e','#9a8b9e'];
const defaults=()=>({
  people:['Hosana','Wagner'],
  cats:[
    {id:'aluguel',name:'Aluguel',icon:'home',pct:20},
    {id:'agua',name:'Conta de água',icon:'drop',pct:2},
    {id:'luz',name:'Conta de luz',icon:'bolt',pct:3},
    {id:'mercado',name:'Mercado',icon:'cart',pct:18},
    {id:'farmacia',name:'Farmácia',icon:'cross',pct:3},
    {id:'feira',name:'Feirinha',icon:'bag',pct:4},
    {id:'carro',name:'Parcela do carro',icon:'car',pct:15},
    {id:'gasolina',name:'Gasolina',icon:'fuel',pct:8},
    {id:'cnpj',name:'CNPJ',icon:'building',pct:4},
    {id:'lizzie',name:'Lizzie',icon:'heart',pct:10},
    {id:'reserva',name:'Reserva de emergência',icon:'shield',pct:10},
    {id:'infinitepay',name:'InfinitePay',icon:'card',pct:0},
    {id:'outros',name:'Outros',icon:'tag',pct:3}
  ],
  incomes:[],lizzieMoves:[],lizzieGoal:0,lizzieMin:500,reserveGoal:0,reserveMoves:[],debts:[]

let S;try{S=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){S=defaults()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(sync.key){sync.dirty=true;persistSync();setStatus('saving');clearTimeout(sync.timer);sync.timer=setTimeout(()=>push(),700)}};
function migrate(){
  const IC0={fixas:'home',mercado:'cart',lizzie:'heart',reserva:'shield',dividas:'card',lazer:'smile',invest:'trend'};
  S.cats.forEach(c=>{if(!c.icon)c.icon=IC0[c.id]||'tag';delete c.emoji});
  if(!S.catv){S.catv=2;
    const used=new Set(S.incomes.flatMap(i=>i.allocs.map(a=>a.catId)));

    const b=base?base[k]:undefined,l=local[k],sv=server[k];
    const isObjArr=a=>Array.isArray(a)&&a.length&&a[0]&&typeof a[0]==='object'&&'id' in a[0];

function dhint(){
  const e=$('#d_hint');if(!e||!ddraft)return;
  const c=+ddraft.count||0,pv=+ddraft.pv||0,en=+ddraft.ent||0,t=+ddraft.total||0,tp=en+c*pv;
  if(!c||!pv){e.textContent='';return}
  e.textContent=`Total a pagar: ${brl(tp)}`+(t>0&&tp-t>0.5?` (acréscimo/juros de ${brl(tp-t)})`:'');
}
function saveDebt(){
  const d=ddraft,count=Math.round(+d.count),pv=+d.pv;
  if(!String(d.name).trim())return alert('Coloque o nome.');
  if(!(count>=1)||!(pv>0))return alert('Coloque o nº de parcelas e o valor da parcela.');
  if(!d.first)return alert('Coloque o vencimento da 1ª parcela.');
  const old=d.id?S.debts.find(x=>x.id===d.id):null,paid=old?{...old.paid}:{};
  if(!old){const n=Math.min(count,Math.max(0,Math.round(+d.paidN)||0));for(let k=1;k<=n;k++)paid[k]=addMonths(d.first,k-1)}
  else Object.keys(paid).forEach(k=>{if(+k>count)delete paid[k]});
  const rec={id:d.id||uid(),name:String(d.name).trim(),kind:d.kind,count,pv,first:d.first,entrada:+d.ent||0,total:+d.total||0,paid};
  if(old)S.debts=S.debts.map(x=>x.id===rec.id?rec:x);else S.debts.push(rec);
  save();$('#modal').innerHTML='';ddraft=null;render();
}

function donut(items){
  const tot=sum(items.map(i=>i.v));if(!tot)return'<div class="empty">Sem dados neste mês.</div>';
  let off=0;const R=60,C=2*Math.PI*R;
  const arcs=items.map(i=>{const len=i.v/tot*C;const s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${i.c}" stroke-width="30" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=len;return s}).join('');
  return `<div class="donutwrap"><svg width="160" height="160" viewBox="0 0 160 160">${arcs}<text x="80" y="78" text-anchor="middle" font-size="11" fill="#8a7f60">total</text><text x="80" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3320">${brl(tot)}</text></svg>
  <div class="legend">${items.map(i=>`<div><i style="background:${i.c}"></i>${i.l} · ${Math.round(i.v/tot*100)}% · ${brl(i.v)}</div>`).join('')}</div></div>`;
}

  return h;
}

/* ---------- modal ---------- */
function openForm(id){
  const i=id?S.incomes.find(x=>x.id===id):null;
  draft=i?{id:i.id,person:i.person,source:i.source,value:i.value,date:i.date,received:i.received,special:i.special,manual:true,repays:(i.allocs.find(a=>a.repays)||{}).repays||'',debts:Object.fromEntries(i.allocs.filter(a=>a.debtId).map(a=>[a.debtId,a.value])),dpaid:Object.fromEntries(i.allocs.filter(a=>a.debtId).map(a=>[a.debtId,a.paid])),outroLabel:(i.allocs.find(a=>a.o)||{}).label||'',allocs:Object.fromEntries(i.allocs.filter(a=>!a.debtId&&(!a.label||a.o)).map(a=>[a.catId,a.value])),paid:Object.fromEntries(i.allocs.filter(a=>!a.debtId&&(!a.label||a.o)).map(a=>[a.catId,a.paid])),extras:i.allocs.filter(a=>a.label&&!a.o&&!a.debtId).map(a=>({name:a.label,value:a.value,cat:a.catId,auto:!!a.auto,paid:!!a.paid}))}
   :{person:S.people[0],source:'',value:'',date:today(),received:true,special:false,manual:true,allocs:{},paid:{},extras:[],outroLabel:'',repays:'',debts:{},dpaid:{}};
  drawForm();
}
function drawForm(){
  const d=draft;
  $('#modal').innerHTML=`<div class="modal" data-act="closem"><div class="sheet">
  <div class="row"><b style="font-size:18px">${d.id?'Editar entrada':'Nova entrada'}</b><button class="b g sm" data-act="closem">Fechar</button></div>
  <div class="two"><div><label>Quem recebeu</label><select id="f_p">${S.people.map(p=>`<option ${p===d.person?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
  <div><label>Valor (R$)</label><input id="f_v" type="number" step="0.01" inputmode="decimal" value="${d.value}"></div></div>
  <div class="two"><div><label>Origem</label><input id="f_s" placeholder="Ex: salário, processo" value="${esc(d.source)}"></div>
  <div><label>Data</label><input id="f_d" type="date" value="${d.date}"></div></div>
  <div class="two"><div><label>Situação</label><select id="f_r"><option value="1" ${d.received?'selected':''}>Já recebi</option><option value="0" ${!d.received?'selected':''}>A receber</option></select></div>
  <div><label>Tipo</label><select id="f_sp"><option value="0" ${!d.special?'selected':''}>Normal</option><option value="1" ${d.special?'selected':''}>Valor especial</option></select></div></div>
  <label>Para onde vai</label>
  ${S.cats.map(c=>`<div class="arow"><span>${ic(c.icon,16)} ${esc(c.name)}</span><input class="fa" data-id="${c.id}" type="number" step="0.01" inputmode="decimal" value="${d.allocs[c.id]??''}"></div>${c.id==='lizzie'?repHtml():''}${c.id==='outros'?`<input id="f_ol" placeholder="Outro o quê? Ex: cartão da Maria" value="${esc(d.outroLabel||'')}" style="margin:-4px 0 8px">`:''}`).join('')}
${debtsFormHtml()}
  <label style="margin-top:10px">Outra conta (o app escolhe a categoria)</label>
  <div id="extras">${extrasHtml()}</div>
  <button class="b g sm" style="margin:6px 0" data-act="xadd">${ic('plus',14)} Adicionar outra conta</button>
  <div id="left" class="mut" style="margin:6px 0"></div>
  <button class="b g" style="width:100%" data-act="redist">Distribuir pelo padrão</button>
  <button class="b" style="width:100%;margin-top:8px;padding:14px" data-act="savef">Salvar</button></div></div>`;
  updLeft();
}
function repHtml(){const ol=openLoans().filter(m=>m.value-retOf(m)-(planRet(m)-(draft.id&&m.id===draft.repays?(+draft.allocs.lizzie||0):0))>0.004||m.id===draft.repays);if(!ol.length)return'';
 return `<div style="margin:-4px 0 8px"><select id="f_rp"><option value="">Dinheiro novo para a Lizzie</option>${ol.map(m=>`<option value="${m.id}" ${m.id===draft.repays?'selected':''}>Devolve empréstimo: ${brl(m.value-retOf(m))} · ${esc(m.who||'—')}</option>`).join('')}</select></div>`}
const exTot=()=>sum((draft.extras||[]).map(x=>+x.value||0))+sum(Object.values(draft.debts||{}).map(x=>+x||0));
function debtsFormHtml(){const l=S.debts.filter(db=>dstats(db).next||(draft.debts&&draft.debts[db.id]));if(!l.length)return'';
 return `<label style="margin-top:10px">Parcelas e empréstimos em andamento</label>`+l.map(db=>{const s=dstats(db);const other=s.planned-(draft.id&&draft.debts[db.id]?+draft.debts[db.id]:0);return `<div class="arow"><span>${ic('card',16)} ${esc(db.name)}<br><small class="mut">falta ${brl(Math.max(0,s.remAmt-other))} · parcela ${brl(db.pv)}</small></span><input class="fd" data-id="${db.id}" type="number" step="0.01" inputmode="decimal" value="${draft.debts[db.id]??''}"></div>`}).join('')}
function catOpts(sel,auto){return `<option value="" ${auto?'selected':''}>Automático</option>`+S.cats.concat(AUTO.filter(a=>!S.cats.some(c=>c.id===a[0])).map(a=>({id:a[0],name:a[1]}))).map(c=>`<option value="${c.id}" ${!auto&&c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('')}
function extrasHtml(){return (draft.extras||[]).map((x,k)=>{const cid=x.auto===false?x.cat:detectCat(x.name);const cn=(cat(cid)||(AUTO.find(a=>a[0]===cid)&&{name:AUTO.find(a=>a[0]===cid)[1]})||{name:'Outros'}).name;
 return `<div class="arow" style="grid-template-columns:1fr 90px 34px"><input class="xn" data-k="${k}" placeholder="Ex: pizza" value="${esc(x.name)}"><input class="xv" data-k="${k}" type="number" step="0.01" inputmode="decimal" value="${x.value||''}"><button class="b d sm" data-act="xdel" data-k="${k}" aria-label="Remover">${ic('x',14)}</button>
 <div class="mut" style="grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:-4px">${ic('tag',12)}<select class="xc" data-k="${k}" style="padding:4px 8px;font-size:12px;height:auto">${catOpts(cid,x.auto!==false)}</select><span>${x.auto!==false?'→ '+esc(cn):''}</span></div></div>`}).join('')}
function updLeft(){
  const v=+draft.value||0,t=sum(Object.values(draft.allocs))+exTot(),l=v-t,e=$('#left');if(!e)return;
  e.innerHTML=Math.abs(l)<0.01?`<span class="good">${ic('check',14)} Tudo destinado</span>`:l>0?`Falta destinar: <b>${brl(l)}</b>`:`<span class="warn">Passou ${brl(-l)} do valor</span>`;
}
function redist(){
  const v=Math.max(0,(+draft.value||0)-exTot());draft.allocs={};let acc=0;
  S.cats.forEach((c,k)=>{let x=k===S.cats.length-1?0:Math.round(v*c.pct)/100;if(k===S.cats.length-1&&sum(S.cats.map(z=>z.pct))>=99.99)x=Math.round((v-acc)*100)/100;acc+=x;draft.allocs[c.id]=x||0});
  document.querySelectorAll('.fa').forEach(el=>el.value=draft.allocs[el.dataset.id]||'');
  updLeft();
}
function saveForm(){
  const d=draft;if(!(+d.value>0)){alert('Coloque o valor.');return}
  const allocs=S.cats.filter(c=>+d.allocs[c.id]>0).map(c=>({catId:c.id,value:+d.allocs[c.id],paid:!!d.paid[c.id],...(c.id==='lizzie'&&d.repays?{repays:d.repays}:{}),...(c.id==='outros'&&(d.outroLabel||'').trim()?{label:d.outroLabel.trim(),o:1}:{})}));
  Object.entries(d.debts||{}).filter(([id,v])=>+v>0&&S.debts.some(x=>x.id===id)).forEach(([id,v])=>{if(!S.cats.some(c=>c.id==='parcelas'))S.cats.push({id:'parcelas',name:'Parcelas',icon:'card',pct:0});const db=S.debts.find(x=>x.id===id);allocs.push({catId:'parcelas',value:+v,paid:!!(d.dpaid||{})[id],debtId:id,label:db.name})});
  (d.extras||[]).filter(x=>+x.value>0).forEach(x=>{const cid=x.auto===false&&x.cat?x.cat:detectCat(x.name);ensureCat(cid);allocs.push({catId:cid,value:+x.value,paid:!!x.paid,label:(x.name||'').trim()||'Outra conta',...(x.auto===false?{}:{auto:1})})});
  const rec={id:d.id||uid(),person:d.person,source:d.source,value:+d.value,date:d.date,received:d.received,special:d.special,allocs};
  if(d.id)S.incomes=S.incomes.map(x=>x.id===d.id?rec:x);else S.incomes.push(rec);
  ym=d.date.slice(0,7);save();$('#modal').innerHTML='';draft=null;render();
}

/* ---------- render ---------- */
const TABS=[['home','home','Início'],['inc','down','Entradas'],['liz','heart','Lizzie'],['res','shield','Reserva'],['parc','card','Parcelas'],['gr','chart','Gráficos'],['set','sliders','Ajustes']];
function render(){
  document.body.classList.toggle('liz',tab==='liz');
  $('#ttl').textContent=tab==='liz'?'Lizzie ✨':tab==='res'?'Reserva':tab==='parc'?'Parcelas':'Nosso Dinheiro';
  $('#logo').innerHTML=tab==='liz'?'🧸':ic({res:'shield',parc:'card'}[tab]||'wallet',19);
  $('#mon').innerHTML=tab==='set'||tab==='liz'||tab==='res'||tab==='parc'?'':`<button data-act="mprev">‹</button><span>${monthName(ym)}</span><button data-act="mnext">›</button>`;
  $('#app').innerHTML={home:vHome,inc:vIncomes,liz:vLizzie,res:vReserve,parc:vDebts,gr:vCharts,set:vSettings}[tab]();
  $('#nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-act="tab" data-t="${t[0]}"><span>${ic(t[1],22)}${(t[0]==='liz'&&lizLow())||(t[0]==='parc'&&debtSoon())?'<em class="bdg">!</em>':''}</span>${t[2]}</button>`).join('');
  $('#fab').style.display=tab==='liz'||tab==='set'||tab==='res'||tab==='parc'?'none':'flex';
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='tab'){tab=el.dataset.t;openDebt=null;render();scrollTo(0,0)}
  else if(a==='mprev'){ym=shift(ym,-1);render()}
  else if(a==='mnext'){ym=shift(ym,1);render()}
  else if(a==='closem'){if(e.target===el||el.tagName==='BUTTON'){$('#modal').innerHTML='';draft=null;ddraft=null}}
  else if(a==='edit')openForm(el.dataset.i);
  else if(a==='del'){if(confirm('Apagar esta entrada?')){S.incomes=S.incomes.filter(i=>i.id!==el.dataset.i);save();render()}}
  else if(a==='rec'){const i=S.incomes.find(x=>x.id===el.dataset.i);i.received=!i.received;save();render()}
  else if(a==='redist')redist();
  else if(a==='savef')saveForm();
  else if(a==='lmadd'){const v=+$('#lm_v').value;if(!(v>0))return alert('Coloque o valor.');const t=$('#lm_t').value,w=document.getElementById('lm_w'),du=document.getElementById('lm_due');if((t==='loan'||t==='lent')&&!(w&&w.value.trim()))return alert(t==='lent'?'Diga a quem você emprestou.':'Diga para que o dinheiro foi usado.');S.lizzieMoves.push({id:uid(),type:t,value:v,desc:$('#lm_d').value,date:$('#lm_dt').value,...((t==='loan'||t==='lent')?{who:w.value.trim(),due:du?du.value:'',ret:0}:{})});save();render()}
  else if(a==='lret'){const m=S.lizzieMoves.find(x=>x.id===el.dataset.id);if(!m)return;const rem=m.value-retOf(m);const inp=prompt('Quanto voltou para a Lizzie? (R$)',String(Math.round(rem*100)/100).replace('.',','));if(inp===null)return;const v=parseFloat(String(inp).replace(',','.'));if(!(v>0))return;m.ret=Math.min(m.value,(+m.ret||0)+v);if(m.ret>=m.value-0.004)m.retDate=today();save();render()}
  else if(a==='lmdel'){S.lizzieMoves=S.lizzieMoves.filter(m=>m.id!==el.dataset.id);save();render()}
  else if(a==='rmadd'){const v=+$('#rm_v').value;if(!(v>0))return alert('Coloque o valor.');S.reserveMoves.push({id:uid(),type:$('#rm_t').value,value:v,desc:$('#rm_d').value,date:$('#rm_dt').value});save();render()}
  else if(a==='rmdel'){S.reserveMoves=S.reserveMoves.filter(m=>m.id!==el.dataset.id);save();render()}
  else if(a==='lgo')submitLogin();
  else if(a==='lmode'){lmode=lmode==='enter'?'create':'enter';lerr='';drawLogin()}
  else if(a==='upd'){const m=document.getElementById('updmsg');if(m)m.textContent='Procurando...';checkUpdate(true).then(r=>{const m=document.getElementById('updmsg');if(m)m.textContent=r==='same'?'Você já está na versão mais recente ✓':r==='err'?'Sem conexão. Tente de novo.':'Atualizando...'})}
  else if(a==='syncnow'){setStatus('saving');pull().then(()=>render())}
  else if(a==='logout'){if(confirm('Sair deste aparelho? Os dados continuam salvos na nuvem; para entrar de novo você vai precisar do PIN.'))doLogout()}
  else if(a==='dadd')openDebtForm();
  else if(a==='dedit')openDebtForm(el.dataset.id);
  else if(a==='dsave')saveDebt();
  else if(a==='ddel'){if(confirm('Apagar este item e todo o histórico de parcelas?')){S.debts=S.debts.filter(x=>x.id!==el.dataset.id);save();render()}}
  else if(a==='dpay'){const db=S.debts.find(x=>x.id===el.dataset.id),s=dstats(db);if(s.next){db.paid[s.next]=today();save();render()}}
  else if(a==='dundo'){const db=S.debts.find(x=>x.id===el.dataset.id),ks=Object.keys(db.paid).map(Number);if(ks.length){delete db.paid[Math.max(...ks)];save();render()}}
  else if(a==='cicon'){const c=cat(el.dataset.id);c.icon=ICON_KEYS[(ICON_KEYS.indexOf(c.icon)+1)%ICON_KEYS.length];save();render()}
  else if(a==='xadd'){draft.extras.push({name:'',value:'',auto:true});document.getElementById('extras').innerHTML=extrasHtml()}
  else if(a==='xdel'){draft.extras.splice(+el.dataset.k,1);document.getElementById('extras').innerHTML=extrasHtml();if(!draft.manual)redist();else updLeft()}
  else if(a==='cadd'){S.cats.push({id:uid(),name:'Nova categoria',icon:'tag',pct:0});save();render()}
  else if(a==='cdel'){if(confirm('Remover categoria? Os lançamentos dela deixam de aparecer.')){S.cats=S.cats.filter(c=>c.id!==el.dataset.id);save();render()}}
  else if(a==='exp'){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='nosso-dinheiro-backup.json';l.click()}
  else if(a==='imp')$('#impf').click();
});
document.addEventListener('change',e=>{
  const el=e.target,a=el.dataset.act;
  if(a==='paid'){const i=S.incomes.find(x=>x.id===el.dataset.i);i.allocs[+el.dataset.k].paid=el.checked;save();render()}
  else if(el.id==='lm_t')lmExtra();
  else if(a==='ldue'){const m=S.lizzieMoves.find(x=>x.id===el.dataset.id);if(m){m.due=el.value;save();render()}}
  else if(a==='lgoal'){S.lizzieGoal=+el.value||0;save();render()}
  else if(a==='lmin'){S.lizzieMin=+el.value||0;save();render()}
  else if(a==='rgoal'){S.reserveGoal=+el.value||0;save();render()}
  else if(a==='dtoggle'){const db=S.debts.find(x=>x.id===el.dataset.id),k=el.dataset.k;if(el.checked)db.paid[k]=today();else delete db.paid[k];openDebt=db.id;save();render()}
  else if(a==='people'){const p=el.value.split(',').map(s=>s.trim()).filter(Boolean);if(p.length){S.people=p;save()}}
  else if(a==='cname'){cat(el.dataset.id).name=el.value;save()}
  else if(a==='cpct'){cat(el.dataset.id).pct=+el.value||0;save();render()}
  else if(el.id==='impf'){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.cats&&j.incomes){S=j;migrate();save();render();alert('Backup importado!')}else alert('Arquivo inválido.')}catch(x){alert('Arquivo inválido.')}};r.readAsText(f)}
});
document.addEventListener('input',e=>{
  const el=e.target;if(!draft)return;
  if(el.id==='f_v'){draft.value=el.value;if(!draft.manual)redist();else updLeft()}
  else if(el.id==='f_p')draft.person=el.value;
  else if(el.id==='f_s')draft.source=el.value;
  else if(el.id==='f_d'){draft.date=el.value;if(el.value){draft.received=el.value<=today();const r=document.getElementById('f_r');if(r)r.value=draft.received?'1':'0'}}
  else if(el.id==='f_rp'){draft.repays=el.value;const m=S.lizzieMoves.find(x=>x.id===el.value);if(m&&!(+draft.allocs.lizzie>0)){draft.allocs.lizzie=Math.round((m.value-retOf(m))*100)/100;document.querySelector('.fa[data-id=lizzie]').value=draft.allocs.lizzie;draft.manual=true;updLeft()}}
  else if(el.id==='f_ol')draft.outroLabel=el.value;
  else if(el.id==='f_r')draft.received=el.value==='1';
  else if(el.id==='f_sp')draft.special=el.value==='1';
  else if(el.classList.contains('fd')){draft.manual=true;draft.debts[el.dataset.id]=+el.value||0;updLeft()}
  else if(el.classList.contains('xn')){const x=draft.extras[+el.dataset.k];x.name=el.value;const r=document.getElementById('extras');r.innerHTML=extrasHtml()}
  else if(el.classList.contains('xv')){draft.extras[+el.dataset.k].value=+el.value||0;if(!draft.manual)redist();else updLeft()}
  else if(el.classList.contains('xc')){const x=draft.extras[+el.dataset.k];if(el.value){x.auto=false;x.cat=el.value}else x.auto=true;document.getElementById('extras').innerHTML=extrasHtml()}
  else if(el.classList.contains('fa')){draft.manual=true;draft.allocs[el.dataset.id]=+el.value||0;updLeft()}
});
document.addEventListener('input',e=>{
  const el=e.target;if(!ddraft||!el.id||el.id.slice(0,2)!=='d_')return;
  const map={d_name:'name',d_kind:'kind',d_total:'total',d_ent:'ent',d_count:'count',d_pv:'pv',d_first:'first',d_paid:'paidN'},f=map[el.id];if(!f)return;
  ddraft[f]=el.value;
  if(el.id==='d_pv')ddraft.pvManual=true;
  else if(!ddraft.pvManual&&(el.id==='d_total'||el.id==='d_ent'||el.id==='d_count')){
    const c=+ddraft.count,t=+ddraft.total,en=+ddraft.ent||0;
    if(c>0&&t>0){ddraft.pv=Math.round((t-en)/c*100)/100;const p=$('#d_pv');if(p)p.value=ddraft.pv}
  }
  dhint();
});
$('#fab').onclick=()=>openForm();
loadSync();
if(sync.key){document.body.classList.remove('locked');render();setStatus(sync.dirty?'saving':'ok');pull()}else showLogin();
setTimeout(()=>checkUpdate(false),2500);
</script>
